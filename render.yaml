# Render Blueprint: API (Node web service) + worker (Docker background worker).
# Secrets are marked sync: false — enter them in the Render dashboard, never in this file.
envVarGroups:
  - name: wellthyfy-crm
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: EMAIL_MODE
        value: dry_run # switch to "live" only after the first-day checklist (README)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: wellthyfy-crm
      - key: TITAN_USER
        sync: false
      - key: TITAN_PASSWORD
        sync: false
      - key: TITAN_FROM_NAME
        value: Selvaganapathy V. | Wellthyfy Lifestyle Ventures
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL_DEFAULT
        value: gemini-3.5-flash-lite
      - key: AI_MODEL_OPTIONAL
        value: gemini-3.8-flash
      - key: USD_TO_INR
        value: '88'
      - key: SERPER_API_KEY
        sync: false
      - key: ZEROBOUNCE_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: APP_URL
        sync: false # e.g. https://crm.wellthyfy.in
      - key: API_URL
        sync: false # e.g. https://wellthyfy-crm-api.onrender.com

services:
  - type: web
    name: wellthyfy-crm-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run build -w @wellthyfy/api
    preDeployCommand: npm run db:migrate
    startCommand: node --enable-source-maps apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - fromGroup: wellthyfy-crm
      - key: NODE_VERSION
        value: '22'

  - type: worker
    name: wellthyfy-crm-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    numInstances: 1 # must stay 1: sending is one-at-a-time
    envVars:
      - fromGroup: wellthyfy-crm
